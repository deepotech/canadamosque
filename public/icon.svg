<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#fef08a" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Gold Emblem Group -->
  <g filter="url(#subtleGlow)" fill="url(#goldGrad)">
    <!-- Finial / Top Spire -->
    <path d="M 256 75 L 259 95 C 263 96 265 100 263 104 C 261 108 257 110 256 110 C 255 110 251 108 249 104 C 247 100 249 96 253 95 Z" />
    <circle cx="256" cy="72" r="5" />

    <!-- Islamic Dome Arc -->
    <path d="M 256 110 
             C 278 145 320 185 325 240
             C 310 230 295 224 280 220
             C 285 180 265 150 256 130
             C 247 150 227 180 232 220
             C 217 224 202 230 187 240
             C 192 185 234 145 256 110 Z" />

    <!-- Crescent Moon Wrapping the Leaf -->
    <path d="M 256 135
             C 335 140 375 220 345 305
             C 320 375 235 410 165 370
             C 115 340 95 270 120 210
             C 125 198 140 205 135 218
             C 115 265 135 325 180 355
             C 235 390 310 360 330 300
             C 355 230 315 165 256 155
             C 245 153 245 137 256 135 Z" />

    <!-- Canadian Maple Leaf in center of crescent/dome -->
    <path d="M 256 210
             L 264 242 L 278 238 L 273 252 L 292 255 L 285 268 L 306 280 L 294 290 L 298 300
             L 278 296 L 274 308 L 263 303 L 260 345 L 252 345 L 249 303 L 238 308 L 234 296
             L 214 300 L 218 290 L 206 280 L 227 268 L 220 255 L 239 252 L 234 238 L 248 242 Z" />
  </g>
</svg>